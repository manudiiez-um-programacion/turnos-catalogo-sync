# Configuracion base, comun a todos los perfiles.
#
# Ningun secreto ni URL de la catedra vive acá: todo entra por variable de
# entorno con ${VAR}, sin valor por defecto sensible. Si una variable falta,
# la aplicacion no arranca, que es el comportamiento buscado.
# El archivo .env no se versiona; .env.example documenta las variables.

spring:
  application:
    name: catalog-sync

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Arrancamos siempre de una base vacia: si hay tablas sin historial de
    # Flyway, es un error y queremos que falle en vez de asumir una linea
    # base inexistente.
    baseline-on-migrate: false
    validate-on-migrate: true
    # Nunca, en ningun perfil: `clean` borraria el esquema completo.
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crean las migraciones de db/migration, nunca
      # Hibernate. validate solo verifica que el mapeo coincida.
      ddl-auto: validate

    # NO poner hibernate.jdbc.time_zone. Estuvo en UTC hasta el issue #16 y
    # corrompia los horarios: Hibernate aplica ese ajuste tambien a las
    # columnas TIME, asi que un horario de 09:00 se guardaba como 12:00 si la
    # app corria en -03:00. El ida y vuelta por JPA lo tapaba —se escribia y
    # se leia con el mismo desplazamiento— pero la fila quedaba mal para
    # cualquier consulta SQL, el valor dependia de la zona de la maquina y las
    # comparaciones del filtro de disponibilidad (#16) daban cualquier cosa.
    #
    # Las horas de atencion son locales y sin zona (§4 de la referencia): una
    # regla semanal no ocurre en un instante, asi que no hay nada que
    # convertir. Y los instantes no necesitan el ajuste: todas las columnas de
    # fecha son TIMESTAMPTZ y se mapean a Instant, que guarda el momento
    # absoluto sin depender de esta propiedad. Hay una prueba que falla si los
    # horarios se vuelven a guardar desplazados.

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      # metrics suma los contadores de sincronizacion (#28): corridas por modo
      # y resultado, errores por codigo y notificaciones por resultado, donde
      # outcome=DUPLICATE es la evidencia de idempotencia de §11. Queda detras
      # de token, como /actuator/info: lo unico publico es health.
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# Swagger UI se puede apagar por configuracion en cualquier perfil.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# Integracion con el servicio central de la catedra.
#
# La URL y las credenciales entran por variable de entorno y no tienen
# valor por defecto: si falta una, la aplicacion no arranca. Los endpoints
# de la referencia ya incluyen /api, asi que CATEDRA_API_BASE_URL es solo
# el origen; si termina en /api, el arranque lo rechaza con un mensaje que
# lo explica (ver CatedraApiProperties).
catedra:
  api:
    base-url: ${CATEDRA_API_BASE_URL}
    username: ${CATEDRA_TECHNICAL_USERNAME}
    password: ${CATEDRA_TECHNICAL_PASSWORD}

    # Timeouts holgados a proposito: el servidor se alcanza por ZeroTier y
    # el enlace tiene ~228 ms de ida y vuelta medidos (decision D6). Sin
    # timeout de lectura, una llamada que no responde cuelga el hilo para
    # siempre.
    connect-timeout: 5s
    read-timeout: 20s

    # Al arrancar se resuelve la cuenta tecnica y, si provisioningStatus no
    # es PROVISIONED, el arranque falla. Queda en true salvo en pruebas: el
    # lado seguro de olvidarse de configurarlo es que la verificacion corra.
    verify-on-startup: true

    # Reintentos del pedido del snapshot ante una falla transitoria —una
    # conexion que se cae, un 503 pasajero— (issue #31). No es lo mismo que
    # reintentar la sincronizacion: esa decision ya esta tomada en el ADR
    # 0004 §7 (no se reintenta en el momento, la recupera la reconciliacion
    # periodica). Esto es mas bajo en la pila: amortigua un solo pedido HTTP
    # antes de dejar que la falla suba y la corrida quede FAILED.
    snapshot-retry:
      max-attempts: 3
      backoff: 2s

  # Lectura del catalogo publicado en Redis (§14, issue #22).
  #
  # Aca solo van los timeouts: el host, el puerto, el usuario y la clave de
  # Redis NO son configuracion de este servicio, llegan en el objeto
  # integration que entrega la catedra (§14.1) y pueden cambiar sin que se
  # reinicie nada.
  #
  # Holgados por el mismo motivo que los de la API: el servidor se alcanza
  # por ZeroTier y el enlace tiene ~228 ms de ida y vuelta medidos (D6). Las
  # dos son obligatorias y tienen que ser positivas: en cero o negativas
  # Lettuce esperaria sin limite, que es justo lo que evitan.
  redis:
    connect-timeout: 5s
    command-timeout: 10s

  # Consumo de CatalogUpdated del topic de catalogo (§15, issue #24).
  #
  # Aca tampoco estan el bootstrap, el topic ni el consumer group: llegan en
  # el objeto integration (§15.2). Lo que se decide aca es cuanto espera el
  # consumidor y cuantas veces reintenta un mensaje.
  #
  # El consumidor arranca DESPUES del arranque del servicio, porque
  # engancharse al topic necesita la configuracion de integracion y el
  # arranque no puede depender de la red privada (D6). Si el primer intento
  # no puede, se reintenta cada startup-retry-interval mientras el servicio
  # este arriba.
  #
  # Los reintentos de un mismo mensaje son acotados (§18.4): al agotarse, el
  # consumidor se detiene sin confirmar el offset y el reintento de arranque
  # lo vuelve a levantar, asi que Kafka lo reentrega. Nunca se saltea un
  # mensaje valido.
  kafka:
    enabled: ${KAFKA_CONSUMER_ENABLED:true}
    poll-timeout: 3s
    startup-retry-interval: 30s
    retry-interval: 5s
    max-retries: 3

# Sincronizacion al arrancar (issue #14).
#
# Con la base recien inicializada —sin version de catalogo aplicada— el
# arranque pide el snapshot completo (§6.1). El trabajo corre en un hilo
# aparte, asi que no atrasa el arranque, y una catedra que no responde deja
# el servicio arriba sin catalogo en lugar de reiniciandose en ciclo: el
# estado se ve en /actuator/health y el motivo queda en sync_run.
#
# Se apaga solo en pruebas, donde cada @SpringBootTest levanta el contexto
# completo y es la prueba la que tiene que decidir cuando se sincroniza.
# El default es true: el lado seguro de olvidarse de configurarlo.
sync:
  startup:
    enabled: ${SYNC_STARTUP_ENABLED:true}

  # Retencion de la memoria de idempotencia (issue #24).
  #
  # processed_event suma una fila por notificacion y nada la achica sola. La
  # ventana solo tiene que ser mas larga que el atraso maximo con el que un
  # duplicado puede llegar, que lo acota la retencion del topic de Kafka:
  # treinta dias son varios ordenes de magnitud mas que eso.
  #
  # Borrar antes de tiempo seria peor que no borrar: un eventId purgado que
  # despues se reentrega se procesaria como si fuera nuevo.
  processed-events:
    retention: ${PROCESSED_EVENTS_RETENTION:30d}
    purge-interval: 6h

  # Reconciliacion periodica (issue #27).
  #
  # Kafka es una notificacion, no la fuente del catalogo: si un aviso se
  # pierde, la comparacion de versiones es la que tiene que detectar y
  # recuperar el atraso (§16). Sin este chequeo, un mensaje que nunca llego
  # dejaria la copia local atrasada hasta el proximo reinicio.
  #
  # El intervalo es el peor caso de cuanto tarda en detectarse ese atraso.
  # Cuando no hay nada que hacer, el costo es una sola lectura de
  # catedra:sync:metadata y ningun log por encima de DEBUG.
  #
  # El primer chequeo no va en cero porque el arranque ya reconcilia por su
  # cuenta: los dos a la vez solo lograrian que uno se encuentre el lock
  # tomado.
  reconciliation:
    enabled: ${SYNC_RECONCILIATION_ENABLED:true}
    interval: ${SYNC_RECONCILIATION_INTERVAL:5m}
    initial-delay: 1m

  # Retencion del historial de sincronizacion (issue #28).
  #
  # sync_run suma una fila por intento y nada la achica sola: con el chequeo
  # periodico corriendo cada pocos minutos, la tabla crece aunque nunca pase
  # nada. Los errores se van con su corrida (ON DELETE CASCADE).
  #
  # A diferencia de la ventana de processed-events, esta no es una restriccion
  # de correctitud: borrar de mas no rompe nada, solo deja menos para
  # diagnosticar. Noventa dias cubren la entrega y un cuatrimestre entero.
  #
  # La corrida mas reciente nunca se borra, aunque sea mas vieja que la
  # ventana: un servicio quieto informaria "ninguna sincronizacion" en lugar
  # de "la ultima fue hace mucho", que es el dato que se esta buscando.
  history:
    retention: ${SYNC_HISTORY_RETENTION:90d}
    purge-interval: 6h

# Seguridad de la API propia (ADR 0002, issue #17).
#
# Dos identidades con dos secretos distintos: el JWT del usuario final que
# emite el servicio de turnos, y el JWT tecnico interno con el que ese mismo
# servicio llama a la agenda vigente. Ninguno es el JWT tecnico de catedra.
#
# Los secretos no tienen valor por defecto: si falta uno, el arranque falla
# con un mensaje que nombra la variable. Un servicio arriba que no sabe
# validar tokens es peor que un servicio que no arranca.
api:
  security:
    user-jwt:
      secret: ${JWT_USER_SECRET}
      issuer: ${JWT_USER_ISSUER:turnos-reservas-service}
    internal-jwt:
      secret: ${JWT_INTERNAL_SECRET}
      issuer: ${JWT_INTERNAL_ISSUER:turnos-reservas-service}

    # Origenes exactos, separados por coma. Nunca "*": lo rechaza el arranque.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.um.catalogsync: INFO
